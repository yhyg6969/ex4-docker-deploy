name: GitOps ASG CICD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: S3 정적웹사이트로 배포
      run: |
        aws s3 cp ./docker-compose.yaml s3://std14-website-s3/docker-compose.yaml
        aws s3 sync ./nginx/index.html s3://std14-website-s3/html/index.html --delete

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image to ECR
      run: |
        docker build --no-cache -t 925047940866.dkr.ecr.eu-west-3.amazonaws.com/nginx:1.31.3-ecr ./nginx
        docker build --no-cache -t 925047940866.dkr.ecr.eu-west-3.amazonaws.com/nginx:latest ./nginx

        docker push 925047940866.dkr.ecr.eu-west-3.amazonaws.com/nginx:1.31.3-ecr
        docker push 925047940866.dkr.ecr.eu-west-3.amazonaws.com/nginx:latest

    - name: 컨테이너 배포 및 S3 파일 싱크 (SSM Run Command)
      run: |
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=tag:Cicd,Values=asg" \
          --parameters "commands=[
            \"sudo aws ecr get-login-password --region eu-west-3 | sudo docker login --username AWS --password-stdin 925047940866.dkr.ecr.eu-west-3.amazonaws.com\",
            \"sudo docker stop nginx-container || true\",
            \"sudo docker rm nginx-container || true\",
            \"sudo mkdir -p /home/ec2-user/nginx/html\",
            \"sudo chown -R ec2-user:nginx /home/ec2-user/nginx\",
            \"sudo aws s3 sync s3://std14-website-s3/html/ /home/ec2-user/nginx/html/ --delete\",
            \"sudo aws s3 cp s3://std14-website-s3/docker-compose.yaml /home/ec2-user/docker-compose.yaml\",
            \"cd /home/ec2-user && sudo docker compose pull\",
            \"cd /home/ec2-user && sudo docker compose up -d --remove-orphans\",
            \"sudo docker image prune -f\"
          ]" \
          --region ${{ secrets.AWS_REGION }} \
          --comment "Deploying SSM docker"