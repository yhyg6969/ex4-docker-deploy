version: '3.8'

services:
  # 1. FastAPI 백엔드 서비스
  fastapi-app:
    image: 925047940866.dkr.ecr.eu-west-3.amazonaws.com/fastapi-backend:latest
    container_name: fastapi-container
    ports:
      - "8000:8000"
    restart: always

  # 2. Nginx 웹 서버 및 역방향 프록시 서비스
  my-service-web:
    image: 925047940866.dkr.ecr.eu-west-3.amazonaws.com/nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ec2-user/nginx/html:/usr/share/nginx/html:ro
    restart: always
    depends_on:
      - fastapi-app